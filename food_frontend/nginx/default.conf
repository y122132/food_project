server {
    listen 80;
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA 라우팅 처리
    }

    # 2. 백엔드 (Django) - ⭐ 이 부분이 중요합니다!
    # /api/ 로 시작하는 주소는 backend 컨테이너로 보낸다는 설정
    location /api/ {
        proxy_pass http://backend:8000;  # docker-compose의 서비스 이름(backend) 확인
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Django Admin (⭐ 여기를 추가하세요!)
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # (선택사항) Admin 페이지의 CSS(스타일)가 깨진다면 이 설정도 필요합니다.
    # Django가 static파일을 모아둔 곳을 연결해야 함
    location /static/ {
        alias /app/static/; 
    }

}
