events {}

http {
    # ▼▼▼▼▼ 이 부분을 추가합니다 ▼▼▼▼▼
    include       mime.types; # 기본 mime.types 파일을 포함하거나,
    default_type  application/octet-stream; # 모르는 파일은 기본값으로 설정

    # 만약 include mime.types가 없다면, CSS/JS만이라도 명시적으로 설정합니다.
    types {
        text/html                             html htm shtml;
        text/css                              css;  # ⭐ 이 부분이 중요합니다.
        application/javascript                js;
    }
    # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲


    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
	
	client_max_body_size 50M;
        
	# 프론트엔드 (React)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 백엔드 (Django API)
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 정적 파일/미디어 파일 처리가 필요하다면 추가 설정 (선택)
        location /static/ {
            alias /app/static/;
        }
    }
}
